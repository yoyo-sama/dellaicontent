# Stack applicative uniquement (web + updater). ComfyUI et Ollama vivent dans leurs
# propres stacks, à la racine du home : ~/comfyui-spark et ~/ollama (déployées par
# install.sh depuis docker/stacks/). Un service ne se déploie jamais deux fois : ici
# nginx les atteint en 127.0.0.1 puisqu'il tourne en network_mode host.
services:
  ai-content-studio:
    image: nginx:alpine
    container_name: ai-content-studio-web
    # network_mode: host — nginx écoute sur :8090 (interface publique de l'hôte)
    # et atteint ComfyUI (127.0.0.1:8188) + Ollama (127.0.0.1:11434) en local.
    network_mode: host
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  updater:
    build: ./docker/updater
    container_name: ai-content-studio-updater
    network_mode: host
    environment:
      - REPO_DIR=/repo
      - LORAS_DIR=/loras
    volumes:
      - ./:/repo:rw
      # Chemin réel écrit dans .env par install.sh ; le défaut suppose la stack
      # ComfyUI voisine (~/comfyui-spark) du repo (~/ai-content-studio).
      - ${COMFY_LORAS_DIR:-../comfyui-spark/basedir/models/loras}:/loras:rw
    restart: unless-stopped
