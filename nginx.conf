# nginx — AI Content Studio : sert l'app statique + reverse-proxy ComfyUI/Ollama.
# Ainsi le navigateur distant n'a besoin que du port 8090 (pas de 8188/11434 exposés).
server {
    listen 8090;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ComfyUI — WebSocket (/ws) avant le reste (match préfixe le plus long).
    location /comfy/ws {
        proxy_pass http://127.0.0.1:8188/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }
    # ComfyUI — API HTTP (+ /view pour les images, /upload/image pour les entrées).
    location /comfy/ {
        proxy_pass http://127.0.0.1:8188/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 50m;
    }
    # Ollama — LLM (enrichissement de prompt, découpage storyboard).
    location /ollama/ {
        proxy_pass http://127.0.0.1:11434/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
    }
    # Updater — vérifie/applique les mises à jour git depuis GitHub.
    location /update/ {
        proxy_pass http://127.0.0.1:8093/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 10g;
    }
    # App statique.
    location / {
        try_files $uri $uri/ =404;
    }
}
