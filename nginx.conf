# nginx — AI Content Studio: serves the static app + reverse-proxies ComfyUI/Ollama, so a
# remote browser only needs port 8090 (8188/11434 are never exposed).
server {
    listen 8090;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ComfyUI — WebSocket (/ws) before the rest (longest prefix match wins).
    location /comfy/ws {
        proxy_pass http://127.0.0.1:8188/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }
    # ComfyUI — HTTP API (+ /view for images, /upload/image for inputs).
    location /comfy/ {
        proxy_pass http://127.0.0.1:8188/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 50m;
    }
    # Ollama — LLM (prompt enrichment, storyboard breakdown).
    location /ollama/ {
        proxy_pass http://127.0.0.1:11434/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
    }
    # Updater — checks/applies git updates from GitHub.
    location /update/ {
        proxy_pass http://127.0.0.1:8093/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 10g;
    }
    # Static app.
    location / {
        try_files $uri $uri/ =404;
    }
}
