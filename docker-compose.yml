# Application stack only (web + updater). ComfyUI and Ollama live in their own stacks at
# the root of the home directory: ~/comfyui-spark and ~/ollama (deployed by install.sh from
# docker/stacks/). A service is never deployed twice: nginx reaches both on 127.0.0.1 since
# it runs in host network mode.
services:
  ai-content-studio:
    image: nginx:alpine
    container_name: ai-content-studio-web
    # network_mode: host — nginx listens on :8090 (the host's public interface) and
    # reaches ComfyUI (127.0.0.1:8188) + Ollama (127.0.0.1:11434) locally.
    network_mode: host
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  updater:
    build: ./docker/updater
    container_name: ai-content-studio-updater
    network_mode: host
    environment:
      - REPO_DIR=/repo
      - LORAS_DIR=/loras
    volumes:
      - ./:/repo:rw
      # Real path written into .env by install.sh; the default assumes the ComfyUI stack
      # (~/comfyui-spark) sits next to the repo (~/ai-content-studio).
      - ${COMFY_LORAS_DIR:-../comfyui-spark/basedir/models/loras}:/loras:rw
    restart: unless-stopped
