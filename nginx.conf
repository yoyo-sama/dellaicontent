# nginx — AI Content Studio: serves the static app + reverse-proxies ComfyUI/Ollama, so a
# remote browser only needs port 8090. ComfyUI listens on 127.0.0.1:8188 only; the deployed
# Ollama is still published on all interfaces (decision pending), its template on 127.0.0.1.
server {
    listen 8090;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ComfyUI — WebSocket (/ws) before the rest (longest prefix match wins).
    location ^~ /comfy/ws {
        proxy_pass http://127.0.0.1:8188/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }
    # ComfyUI — HTTP API (+ /view for images, /upload/image for inputs).
    location ^~ /comfy/ {
        proxy_pass http://127.0.0.1:8188/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 500m;
    }
    # Ollama — LLM (prompt enrichment, storyboard breakdown).
    location ^~ /ollama/ {
        proxy_pass http://127.0.0.1:11434/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
    # Updater — checks/applies git updates from GitHub.
    location ^~ /update/ {
        proxy_pass http://127.0.0.1:8093/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 10g;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
    }
    # Gallery — index/thumbnails of ComfyUI's output folder (SQLite service). $http_host (not $host)
    # keeps the port, which the service compares with the Origin header on write routes.
    location ^~ /gallery/ {
        proxy_pass http://127.0.0.1:8094/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 1m;
        proxy_read_timeout 60s;
    }
    location ~ /\. { deny all; }
    location ~ ^/(tools|docker|scripts)/ { deny all; }
    # Static app. "no-cache" = le navigateur revalide à chaque requête (304 si rien n'a
    # changé) au lieu d'appliquer sa mise en cache heuristique. Sans cet en-tête, un
    # `git pull` n'était visible qu'après un Ctrl+Shift+R, le navigateur continuant de
    # servir l'ancien index.html. Ce n'est PAS "no-store" : rien n'est retéléchargé
    # inutilement, seule la fraîcheur est vérifiée.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
