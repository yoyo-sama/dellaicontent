# ComfyUI stack — deployed by install.sh into ~/comfyui-spark/compose.yaml.
# Traced from the reference GB10 stack: these variables are NOT cosmetic.
#  - without BASE_DIRECTORY, ComfyUI ignores /basedir and looks for its models in
#    /comfy/mnt/ComfyUI/models — the models install.sh downloads are then invisible;
#  - without --disable-pinned-memory / --reserve-vram 8, ComfyUI gets killed on the GB10
#    unified memory in the middle of a job;
#  - WANTED_UID/GID give the generated files to the user (otherwise root-owned folders).
services:
  comfyui-nvidia:
    image: mmartial/comfyui-nvidia-docker:ubuntu24_cuda13.1-dgx-latest
    container_name: comfyui-nvidia
    ports:
      - "8188:8188"
    volumes:
      - ./userscripts_dir:/userscripts_dir
      - ./run:/comfy/mnt
      - ./basedir:/basedir
      - /etc/localtime:/etc/localtime:ro
    environment:
      WANTED_UID: "${WANTED_UID:-1000}"   # real values written by install.sh into the stack .env
      WANTED_GID: "${WANTED_GID:-1000}"
      BASE_DIRECTORY: /basedir
      USE_NEW_MANAGER: "true"
      ENABLE_MANAGER_LEGACY_UI: "true"
      SECURITY_LEVEL: weak
      COMFY_CMDLINE_EXTRA: --use-pytorch-cross-attention --disable-pinned-memory --reserve-vram 8 --enable-cors-header
      NVIDIA_VISIBLE_DEVICES: all
      USE_UV: "true"
      FORCE_REINSTALL: "false"
      CUDA_HOME: /usr/local/cuda
      CUDA_CACHE_MAXSIZE: "4294967296"   # 4 GB kernel cache = ~3x speedup on reruns
      NCCL_P2P_DISABLE: "1"              # single GPU, NCCL not needed
      HF_TOKEN: ${HF_TOKEN:-}            # Hugging Face token: never hardcoded here
      HF_HUB_DISABLE_TELEMETRY: "true"
    ulimits:
      memlock: -1
      stack: 67108864
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, utility]
    restart: unless-stopped
