# Ollama stack — deployed by install.sh into ~/ollama/compose.yaml.
# Weights live in ./data (bind mount) rather than in an anonymous Docker volume, so the
# folder stays inspectable and easy to back up from the home directory. The container runs
# as root (official image): the files it writes inside data/ belong to root.
services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-api
    ports:
      - "11434:11434"
    volumes:
      - ./data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Starts the server then makes sure gemma4:e4b is present (idempotent: `ollama pull`
    # does not re-download a model that is already local).
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        sleep 3
        ollama pull gemma4:e4b
        wait
    restart: unless-stopped
